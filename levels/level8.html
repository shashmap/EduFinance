<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level 8 - Real Estate Investment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #f8f9fa;
      background-image:
        radial-gradient(circle at 1px 1px, #dbeafe 1px, transparent 0),
        radial-gradient(circle at 25px 25px, #e0e7ff 1px, transparent 0);
      background-size: 50px 50px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
    }

    .title {
      color: #2563eb;
      text-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
      animation: glow-title 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow-title {
      from { text-shadow: 0 0 8px #2563eb; }
      to { text-shadow: 0 0 16px #3b82f6; }
    }

    .game-info-button {
      position: fixed;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid #2563eb;
      padding: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .game-info-button span {
      color: #2563eb;
    }

    @media (max-width: 768px) {
      .game-info-button {
        left: 1rem;
        top: 1rem;
        transform: none;
      }
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      z-index: 1000;
    }

    .modal.show {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }

    .modal > div {
      background: white;
      border: 2px solid #2563eb;
    }

    .text-blue-400 { color: #2563eb !important; }
    .text-blue-300 { color: #60a5fa !important; }
    .text-gray-400 { color: #64748b !important; }
    .text-yellow-400 { color: #facc15 !important; }

    input[type="range"],
    input[type="checkbox"] {
      accent-color: #2563eb;
    }

    button,
    .modal button {
      background-color: #2563eb;
      color: white;
    }

    button:hover,
    .modal button:hover {
      background-color: #1e40af;
      box-shadow: 0 0 10px rgba(30, 64, 175, 0.4);
    }
  </style>
</head>
<body>
  <button class="game-info-button" onclick="toggleGameInfo()">
    <span class="text-2xl text-blue-400">❔</span>
  </button>

  <div id="gameInfoModal" class="modal">
    <div class="border-2 border-blue-500 rounded-lg p-8 m-auto max-w-lg">
      <h3 class="text-2xl text-blue-400 mb-6">Level 8: Real Estate Investment</h3>
      <div class="space-y-4 text-gray-400">
        <p>🎯 Goal: Build a profitable property portfolio</p>
        <div class="pl-4 space-y-2">
          <p>🏠 Down Payment: Min 20%</p>
          <p>📊 Debt-to-Income: Max 43%</p>
          <p>💰 ROI Target: Min 8%</p>
          <p>🏘️ Property Mix: Min 2 types</p>
        </div>
        <p class="text-yellow-400">Balance risk and returns!</p>
      </div>
      <button onclick="toggleGameInfo()" class="mt-6 py-2 px-4 rounded">
        Got it!
      </button>
    </div>
  </div>

  <div class="container max-w-2xl w-full px-4 py-10">
    <h1 class="title text-4xl md:text-6xl text-center mb-12">LEVEL 8</h1>
    <h2 class="text-2xl text-center text-blue-400 mb-8">Real Estate Investment</h2>

    <div class="bg-white shadow-md p-6 rounded-lg mb-8">
      <div class="space-y-6">
        <div>
          <label class="block text-blue-300 mb-2">Down Payment (%)</label>
          <input type="range" id="downPayment" min="0" max="40" value="0" class="w-full">
          <div class="flex justify-between mt-2">
            <span class="text-blue-400"><span id="downPaymentValue">0</span>%</span>
            <span class="text-blue-400">40%</span>
          </div>
        </div>

        <div>
          <label class="block text-blue-300 mb-2">Property Types</label>
          <div class="grid grid-cols-2 gap-4">
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="residential" class="form-checkbox">
              <span class="text-blue-400">Residential</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="commercial" class="form-checkbox">
              <span class="text-blue-400">Commercial</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="rental" class="form-checkbox">
              <span class="text-blue-400">Rental</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="reit" class="form-checkbox">
              <span class="text-blue-400">REIT</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-blue-300 mb-2">Monthly Income ($)</label>
          <input type="range" id="income" min="0" max="10000" step="100" value="0" class="w-full">
          <div class="flex justify-between mt-2">
            <span class="text-blue-400">$<span id="incomeValue">0</span></span>
            <span class="text-blue-400">$10,000</span>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mb-8">
      <p class="text-xl text-yellow-400">ROI: <span id="roi">0</span>%</p>
      <p class="text-xl text-blue-400 mt-2">DTI Ratio: <span id="dti">0</span>%</p>
    </div>

    <button id="submit-investment" class="w-full py-4 text-xl rounded-lg">
      SUBMIT INVESTMENT PLAN
    </button>
    <p id="message" class="mt-6 text-center text-yellow-400 text-xl"></p>
  </div>

  <script src="../logic/level8.js"></script>
  <script>
    function toggleGameInfo() {
      const modal = document.getElementById('gameInfoModal');
      modal.classList.toggle('show');
    }
  </script>
</body>
</html>
